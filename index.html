<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <title>StudyFlow — Đăng nhập & Không gian học tập thông minh</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Firebase Auth SDK (Compat v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <style>
    :root {
      --font-sans: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      --indigo: #6366f1;
      --indigo-hover: #4f46e5;
      --indigo-soft: rgba(99, 102, 241, 0.12);
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --amber: #f59e0b;
      --rose: #ef4444;
      --rose-soft: rgba(239, 68, 68, 0.14);
      --bg-app: #f3f5f9;
      --bg-surface: #ffffff;
      --bg-surface-2: #f8fafc;
      --border-color: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --radius-lg: 20px;
      --radius-md: 12px;
      --shadow-lg: 0 20px 44px rgba(15, 23, 42, 0.12);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --bg-app: #0b1120;
      --bg-surface: #131c31;
      --bg-surface-2: #1a253e;
      --border-color: #24324d;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --indigo-soft: rgba(99, 102, 241, 0.22);
      --emerald-soft: rgba(16, 185, 129, 0.22);
      --rose-soft: rgba(239, 68, 68, 0.22);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      font-family: var(--font-sans);
      background: var(--bg-app);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      padding: calc(16px + var(--safe-top)) 16px calc(20px + var(--safe-bottom));
    }

    .top-bar {
      width: 100%;
      max-width: 960px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--indigo);
    }

    .icon-btn {
      min-height: 44px;
      min-width: 44px;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }

    .auth-shell {
      width: 100%;
      max-width: 460px;
      margin: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-lg);
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px;
    }

    .auth-tab {
      min-height: 42px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    .auth-tab.active {
      background: var(--indigo);
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      min-height: 46px;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-surface-2);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px var(--indigo-soft);
      background: var(--bg-surface);
    }

    .btn-primary {
      width: 100%;
      min-height: 46px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--indigo);
      color: #ffffff;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-primary:hover {
      background: var(--indigo-hover);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .oauth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .oauth-btn {
      min-height: 46px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-surface-2);
      color: var(--text-primary);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .oauth-btn:hover {
      border-color: var(--indigo);
      background: var(--indigo-soft);
    }

    .guest-btn {
      width: 100%;
      min-height: 42px;
      margin-top: 12px;
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-color);
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      touch-action: manipulation;
    }

    .status-box {
      display: none;
      margin-bottom: 14px;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-box.error {
      display: block;
      background: var(--rose-soft);
      color: var(--rose);
    }

    .status-box.success {
      display: block;
      background: var(--emerald-soft);
      color: var(--emerald);
    }

    .session-card {
      display: none;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .session-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--indigo-soft);
      color: var(--indigo);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.05rem;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 480px) {
      .oauth-grid {
        grid-template-columns: 1fr;
      }
      .auth-shell {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="brand">⚡ StudyFlow</div>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Đổi giao diện Sáng/Tối">🌓</button>
  </header>

  <!-- Khung hiển thị khi đã đăng nhập hoặc vào chế độ Khách -->
  <section class="session-card" id="sessionCard">
    <div class="session-header">
      <div class="user-meta">
        <div class="avatar-circle" id="userAvatar">SF</div>
        <div>
          <div style="font-weight: 800; font-size: 1rem;" id="userName">Học viên StudyFlow</div>
          <div style="font-size: 0.82rem; color: var(--text-secondary);" id="userSubInfo">Kho lưu trữ: khách</div>
        </div>
      </div>
      <button type="button" class="icon-btn" id="logoutBtn">Đăng xuất</button>
    </div>
  </section>

  <!-- Form Đăng nhập / Đăng ký -->
  <main class="auth-shell" id="authCard">
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" id="tabLogin" role="tab" aria-selected="true">Đăng nhập</button>
      <button type="button" class="auth-tab" id="tabRegister" role="tab" aria-selected="false">Đăng ký</button>
    </div>

    <div class="status-box" id="authStatus"></div>

    <form id="authForm">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label class="form-label" for="displayNameInput">Tên hiển thị</label>
        <input class="form-input" type="text" id="displayNameInput" placeholder="Ví dụ: Minh Anh" autocomplete="name" />
      </div>

      <div class="form-group">
        <label class="form-label" for="emailInput">Email</label>
        <input class="form-input" type="email" id="emailInput" placeholder="ban@example.com" autocomplete="email" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="passwordInput">Mật khẩu</label>
        <input class="form-input" type="password" id="passwordInput" placeholder="Ít nhất 6 ký tự" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn-primary" id="submitAuthBtn">Đăng nhập</button>
    </form>

    <div class="divider">HOẶC TIẾP TỤC VỚI</div>

    <div class="oauth-grid">
      <button type="button" class="oauth-btn" id="googleLoginBtn">
        <span>G</span> Google
      </button>
      <button type="button" class="oauth-btn" id="facebookLoginBtn">
        <span>f</span> Facebook
      </button>
    </div>

    <button type="button" class="guest-btn" id="guestContinueBtn">
      Tiếp tục dùng thử với tư cách Khách (lưu trên thiết bị này)
    </button>
  </main>

  <script>
    // Thay các giá trị dưới đây bằng cấu hình Web App từ Firebase Console
    const FIREBASE_CONFIG = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      appId: "YOUR_FIREBASE_APP_ID"
    };

    const isFirebaseConfigured = !FIREBASE_CONFIG.apiKey.startsWith("YOUR_");
    let auth = null;

    if (isFirebaseConfigured && window.firebase) {
      if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
      }
      auth = firebase.auth();
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
    }

    let mode = "login";
    const statusBox = document.getElementById("authStatus");
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const nameGroup = document.getElementById("nameGroup");
    const submitBtn = document.getElementById("submitAuthBtn");
    const passwordInput = document.getElementById("passwordInput");

    function showStatus(msg, type = "error") {
      statusBox.textContent = msg;
      statusBox.className = `status-box ${type}`;
    }

    function clearStatus() {
      statusBox.textContent = "";
      statusBox.className = "status-box";
    }

    function setMode(nextMode) {
      mode = nextMode;
      clearStatus();
      const isReg = mode === "register";
      tabLogin.classList.toggle("active", !isReg);
      tabRegister.classList.toggle("active", isReg);
      tabLogin.setAttribute("aria-selected", String(!isReg));
      tabRegister.setAttribute("aria-selected", String(isReg));
      nameGroup.style.display = isReg ? "block" : "none";
      submitBtn.textContent = isReg ? "Tạo tài khoản" : "Đăng nhập";
      passwordInput.setAttribute("autocomplete", isReg ? "new-password" : "current-password");
    }

    tabLogin.addEventListener("click", () => setMode("login"));
    tabRegister.addEventListener("click", () => setMode("register"));

    function getUserStorageKey(uid) {
      return `studyflow_app_state_v1_${uid || "guest"}`;
    }

    function applySessionUI(profile) {
      const authCard = document.getElementById("authCard");
      const sessionCard = document.getElementById("sessionCard");
      if (!profile) {
        authCard.style.display = "block";
        sessionCard.style.display = "none";
        return;
      }
      authCard.style.display = "none";
      sessionCard.style.display = "block";
      document.getElementById("userName").textContent = profile.displayName || profile.email || "Học viên StudyFlow";
      document.getElementById("userSubInfo").textContent =
        `${profile.email || "Chế độ khách"} • Key dữ liệu: ${getUserStorageKey(profile.uid)}`;

      const avatarEl = document.getElementById("userAvatar");
      if (profile.photoURL) {
        avatarEl.innerHTML = `<img src="${profile.photoURL}" alt="Ảnh đại diện" />`;
      } else {
        const initial = (profile.displayName || profile.email || "S").charAt(0).toUpperCase();
        avatarEl.textContent = initial;
      }
    }

    function formatAuthError(err) {
      const code = err?.code || "";
      if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") {
        return "Email hoặc mật khẩu không chính xác.";
      }
      if (code === "auth/email-already-in-use") {
        return "Email này đã được đăng ký tài khoản.";
      }
      if (code === "auth/weak-password") {
        return "Mật khẩu cần có ít nhất 6 ký tự.";
      }
      if (code === "auth/unauthorized-domain") {
        return "Tên miền hiện tại chưa được thêm vào Authorized domains trên Firebase.";
      }
      return err?.message || "Đã xảy ra lỗi xác thực.";
    }

    async function signInWithOAuth(providerName) {
      clearStatus();
      if (!auth) {
        showStatus("Bạn chưa điền FIREBASE_CONFIG thật. Hãy dán cấu hình từ Firebase Console để đăng nhập Google/Facebook.", "error");
        return;
      }
      const provider = providerName === "google"
        ? new firebase.auth.GoogleAuthProvider()
        : new firebase.auth.FacebookAuthProvider();

      try {
        // Popup hoạt động tốt trên đa số trình duyệt; nếu bị chặn trên mobile/webview thì chuyển sang redirect
        await auth.signInWithPopup(provider);
      } catch (err) {
        if (err?.code === "auth/popup-blocked" || err?.code === "auth/operation-not-supported-in-this-environment") {
          await auth.signInWithRedirect(provider);
        } else {
          showStatus(formatAuthError(err), "error");
        }
      }
    }

    document.getElementById("googleLoginBtn").addEventListener("click", () => signInWithOAuth("google"));
    document.getElementById("facebookLoginBtn").addEventListener("click", () => signInWithOAuth("facebook"));

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearStatus();
      const email = document.getElementById("emailInput").value.trim();
      const password = passwordInput.value;
      const displayName = document.getElementById("displayNameInput").value.trim();

      if (!auth) {
        showStatus("Chế độ cấu hình mẫu: hãy điền FIREBASE_CONFIG để lưu tài khoản thật trên Firebase.", "error");
        return;
      }

      try {
        if (mode === "register") {
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          if (displayName && cred.user) {
            await cred.user.updateProfile({ displayName });
          }
          showStatus("Đăng ký tài khoản thành công!", "success");
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        showStatus(formatAuthError(err), "error");
      }
    });

    document.getElementById("guestContinueBtn").addEventListener("click", () => {
      localStorage.setItem("studyflow_guest_mode", "1");
      applySessionUI({ uid: "guest", displayName: "Khách học tập", email: "Lưu cục bộ trên máy" });
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      localStorage.removeItem("studyflow_guest_mode");
      if (auth && auth.currentUser) {
        await auth.signOut();
      }
      applySessionUI(null);
    });

    if (auth) {
      auth.onAuthStateChanged((user) => {
        if (user) {
          localStorage.removeItem("studyflow_guest_mode");
          applySessionUI({
            uid: user.uid,
            displayName: user.displayName,
            email: user.email,
            photoURL: user.photoURL
          });
        } else if (localStorage.getItem("studyflow_guest_mode") === "1") {
          applySessionUI({ uid: "guest", displayName: "Khách học tập", email: "Lưu cục bộ trên máy" });
        } else {
          applySessionUI(null);
        }
      });
    } else if (localStorage.getItem("studyflow_guest_mode") === "1") {
      applySessionUI({ uid: "guest", displayName: "Khách học tập", email: "Lưu cục bộ trên máy" });
    }

    // Đổi giao diện Sáng / Tối
    const themeBtn = document.getElementById("themeBtn");
    const savedTheme = localStorage.getItem("studyflow_theme") || "light";
    document.documentElement.setAttribute("data-theme", savedTheme);

    themeBtn.addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("studyflow_theme", next);
    });
  </script>
</body>
</html>
